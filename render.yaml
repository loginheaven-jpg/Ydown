services:
  - type: web
    name: ydown-audio
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: YDOWN_REQUIRE_PASSWORD
        value: "1"
      - key: YDOWN_PASSWORD
        sync: false
      - key: YDOWN_MAX_CONCURRENT_JOBS
        value: "1"
