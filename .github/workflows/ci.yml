name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ydown:test .
      - name: Verify container health, templates, authentication and WebSocket
        shell: bash
        run: |
          docker run -d --name ydown-test -p 8000:8000 -e YDOWN_PASSWORD=ci-password -e YDOWN_REQUIRE_PASSWORD=1 ydown:test
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          docker exec -i ydown-test python < scripts/check-container.py
      - if: always()
        run: docker logs ydown-test
      - name: Verify public download site mode
        shell: bash
        run: |
          docker run -d --name ydown-site -e YDOWN_MODE=download-site -e YDOWN_PASSWORD=ci-password -e YDOWN_REQUIRE_PASSWORD=1 ydown:test
          for i in {1..30}; do
            if docker exec ydown-site python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"; then break; fi
            sleep 1
          done
          docker exec -i ydown-site python < scripts/check-download-site.py
      - if: always()
        run: docker logs ydown-site
