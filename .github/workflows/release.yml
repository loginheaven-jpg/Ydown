name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match version.py" }
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and verify installer and portable ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: YDown-windows-x64
          path: |
            dist/YDown-Setup-x64.exe
            dist/YDown-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YDown-windows-x64
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "YDown $RELEASE_TAG" --generate-notes
